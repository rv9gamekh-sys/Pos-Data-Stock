<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <!-- Meta Tag សម្រាប់ធ្វើឱ្យ Mobile Fit ទំហំអេក្រង់ iPhone ស្អាត 100% -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS & Inventory Management</title>
    
    <!-- App Mobile Styling -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 12px;
            max-width: 100vw;
            overflow-x: hidden;
        }

        header {
            background: #0f766e;
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        main.container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-card {
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>📦 POS & Inventory Management</h1>
    </header>

    <main class="container">
        <!-- ទីតាំងបង្ហាញ Section របស់ Purchase Order និង Modules ផ្សេងៗ -->
        <div id="welcomeView" style="display: none;"></div>
    </main>

    <!-- Import JavaScript Modules -->
    <script src="stock-in-out.js"></script>
    <script src="waste-stock.js"></script>
    <script src="purchase-order.js"></script>
</body>
</html>
